[package]
name = "cyber-desktop"
version = "0.1.0"
description = "CYBER deterministic desktop shell"
edition = "2024"
rust-version = "1.85"

[lib]
name = "cyber_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }

[dev-dependencies]
serde_json = "1.0"
