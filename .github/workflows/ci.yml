name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check migrated paths for placeholders
        if: runner.os == 'Linux'
        run: |
          sh scripts/check-placeholders.sh --self-test
          sh scripts/check-todos.sh --self-test
          sh scripts/check-placeholders.sh
          sh scripts/check-brand.sh
          sh scripts/check-entrypoint-reachability.sh

      - name: Test
        run: go test ./... -count=1

      - name: Race test
        if: runner.os == 'Linux'
        run: go test -race ./...

      - name: Security and integration tests
        run: go test ./tests/security ./tests/integration

      - name: Coverage thresholds
        if: runner.os == 'Linux'
        run: sh scripts/check-coverage.sh

      - name: Vet
        run: go vet ./...

      - name: Build CLI
        run: go build -o cyber-code${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/cli

  vscode:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix editors/vscode

      - name: Test
        run: npm test --prefix editors/vscode

      - name: Compile
        run: npm run compile --prefix editors/vscode

  web:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser tests
        run: pnpm test:e2e
