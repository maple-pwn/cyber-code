name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check migrated paths for placeholders
        if: runner.os == 'Linux'
        run: |
          sh scripts/check-placeholders.sh --self-test
          sh scripts/check-placeholders.sh
          sh scripts/check-brand.sh

      - name: Test
        run: go test ./...

      - name: Race test
        if: runner.os == 'Linux'
        run: go test -race ./...

      - name: Security and integration tests
        run: go test ./tests/security ./tests/integration

      - name: Coverage thresholds
        if: runner.os == 'Linux'
        run: sh scripts/check-coverage.sh

      - name: Vet
        run: go vet ./...

      - name: Build CLI
        run: go build -o cyber-code${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/cli
